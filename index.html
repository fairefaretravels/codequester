<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02050b">
  <title>CodeQuestER</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02050b;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.min.js"></script>
  <script src="trackgenerator.js"></script>

  <!-- Optional systems. Each one is guarded in main.js, so if a file
       fails to load the driving game still runs. Order matters:
       music -> locations (also defines CQHooks) -> city visuals. -->
  <script src="music.js"></script>
<script src="main.js"></script>
<script src="drivercontrols.js"></script>
<script src="tapedeck.js"></script>
  <script src="cityvisuals.js"></script>
  <script src="locations.js"></script>
  <!-- Steering wheel + radio. Needs main.js (window.CQGame) and music.js. -->
</body>
</html>
